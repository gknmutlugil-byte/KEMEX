<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KEMEX</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#090b10;
    color:#d7dbe4;
    font-family:Arial,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}

#app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    height:55px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    background:#131722;
    border-bottom:1px solid #2a2e39;
}

.logo{
    color:#f0b90b;
    font-size:20px;
    font-weight:bold;
    white-space:nowrap;
}

.demo{
    color:#858c99;
    border:1px solid #353a46;
    padding:4px 6px;
    border-radius:4px;
    font-size:9px;
}

.search{
    width:180px;
    height:33px;
    background:#1e222d;
    color:#fff;
    border:1px solid #363a45;
    border-radius:5px;
    padding:0 9px;
    outline:none;
}

.wallet{
    margin-left:auto;
    display:flex;
    gap:15px;
    font-size:10px;
}

.wallet b{
    color:#fff;
    font-size:12px;
}

.live{
    color:#26a69a;
    font-size:11px;
}

.main{
    flex:1;
    min-height:0;
    display:flex;
}

.left{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.toolbar{
    height:40px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:4px;
    padding:4px 7px;
    background:#131722;
    border-bottom:1px solid #2a2e39;
}

.tf{
    height:30px;
    border:0;
    border-radius:4px;
    background:transparent;
    color:#9da3ae;
    padding:0 10px;
}

.tf.active{
    background:#2962ff;
    color:#fff;
}

.chart{
    flex:1;
    min-height:250px;
    position:relative;
    background:#090b10;
}

#chart{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.chartInfo{
    position:absolute;
    left:10px;
    top:10px;
    padding:8px 10px;
    background:rgba(19,23,34,.95);
    border:1px solid #292e39;
    border-radius:5px;
    font-size:11px;
    line-height:17px;
    pointer-events:none;
}

.marketPanel{
    width:285px;
    min-width:285px;
    height:100%;
    background:#131722;
    border-left:1px solid #2a2e39;
    display:flex;
    flex-direction:column;
}

.marketHeader{
    height:43px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    border-bottom:1px solid #2a2e39;
    font-size:12px;
    font-weight:bold;
}

.marketCount{
    color:#f0b90b;
}

.marketList{
    flex:1;
    min-height:0;
    overflow-y:auto;
}

.market{
    height:50px;
    flex-shrink:0;
    padding:6px 9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #1e222b;
    cursor:pointer;
}

.market:hover{
    background:#1d212b;
}

.market.active{
    background:#202633;
    border-left:3px solid #2962ff;
    padding-left:6px;
}

.marketName{
    font-size:11px;
    font-weight:bold;
}

.marketCap{
    color:#707886;
    font-size:8px;
    margin-top:3px;
}

.marketRight{
    text-align:right;
}

.marketPrice{
    font-size:11px;
    font-weight:bold;
}

.marketChange{
    font-size:9px;
    margin-top:3px;
}

.green{color:#26a69a}
.red{color:#ef5350}
.yellow{color:#f0b90b}
.gray{color:#7d8592}

.bottom{
    height:280px;
    flex-shrink:0;
    display:flex;
    gap:7px;
    padding:7px;
    background:#131722;
    border-top:1px solid #2a2e39;
}

.box{
    background:#191d26;
    border:1px solid #292e39;
    border-radius:5px;
    padding:8px;
    overflow:auto;
}

.trade{
    width:250px;
    flex-shrink:0;
}

.orderbook{
    width:210px;
    flex-shrink:0;
}

.positions{
    flex:1;
    min-width:350px;
}

.history{
    width:210px;
    flex-shrink:0;
}

.title{
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
}

label{
    display:block;
    color:#7e8795;
    font-size:8px;
    margin-bottom:3px;
}

input,select{
    width:100%;
    height:28px;
    background:#101319;
    color:#fff;
    border:1px solid #343a47;
    border-radius:4px;
    padding:0 6px;
    outline:none;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-top:7px;
}

.long,
.short{
    height:30px;
    border:0;
    border-radius:4px;
    color:#fff;
    font-weight:bold;
    font-size:10px;
}

.long{background:#159b82}
.short{background:#d94343}

.reset{
    width:100%;
    height:27px;
    margin-top:6px;
    border:0;
    border-radius:4px;
    background:#343a47;
    color:#fff;
    font-size:9px;
}

.bookRow{
    display:flex;
    justify-content:space-between;
    padding:4px 2px;
    border-bottom:1px solid #222631;
    font-size:9px;
}

.bookMid{
    text-align:center;
    color:#f0b90b;
    padding:6px 0;
    border-top:1px solid #303542;
    border-bottom:1px solid #303542;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:9px;
}

th{
    color:#737b88;
    font-weight:normal;
    text-align:left;
}

th,td{
    padding:5px 3px;
    border-bottom:1px solid #292e39;
    white-space:nowrap;
}

.close{
    height:21px;
    padding:0 6px;
    border:0;
    border-radius:3px;
    background:#ef5350;
    color:#fff;
    font-size:8px;
}

.historyRow{
    display:grid;
    grid-template-columns:40px 1fr 48px;
    gap:3px;
    padding:5px 0;
    border-bottom:1px solid #292e39;
    font-size:8px;
}

@media(max-width:1100px){

    .marketPanel{
        width:250px;
        min-width:250px;
    }

    .history{
        display:none;
    }

    .orderbook{
        width:190px;
    }

    .trade{
        width:235px;
    }

    .wallet{
        gap:8px;
    }
}

@media(max-width:800px){

    .marketPanel{
        width:220px;
        min-width:220px;
    }

    .orderbook{
        display:none;
    }

    .wallet{
        display:none;
    }

    .search{
        width:140px;
    }

    .positions{
        min-width:300px;
    }
}

@media(max-width:550px){

    .marketPanel{
        width:190px;
        min-width:190px;
    }

    .market{
        height:47px;
    }

    .marketName{
        font-size:10px;
    }

    .marketPrice{
        font-size:10px;
    }

    .trade{
        display:none;
    }

    .positions{
        display:none;
    }

    .bottom{
        display:none;
    }

    .search{
        width:110px;
    }

    .demo{
        display:none;
    }
}
</style>
</head>

<body>

<div id="app">

<header class="header">

    <div class="logo">⚡ KEMEX</div>

    <div class="demo">PRO DEMO</div>

    <input
        id="search"
        class="search"
        placeholder="Piyasa ara..."
    >

    <div class="wallet">

        <span>
            Bakiye
            <b id="balance">$10,000.00</b>
        </span>

        <span>
            Serbest
            <b id="available">$10,000.00</b>
        </span>

        <span>
            Özsermaye
            <b id="equity">$10,000.00</b>
        </span>

    </div>

    <div class="live">
        ● CANLI
    </div>

</header>

<div class="main">

<div class="left">

    <div class="toolbar">

        <button class="tf active" data-tf="1m">1m</button>
        <button class="tf" data-tf="5m">5m</button>
        <button class="tf" data-tf="15m">15m</button>
        <button class="tf" data-tf="1h">1H</button>
        <button class="tf" data-tf="4h">4H</button>
        <button class="tf" data-tf="1d">1D</button>

    </div>

    <div class="chart">

        <canvas id="chart"></canvas>

        <div id="chartInfo" class="chartInfo"></div>

    </div>

    <div class="bottom">

        <div class="box trade">

            <div class="title">
                İşlem Aç —
                <span id="tradeSymbol">KEMCOIN</span>
            </div>

            <div class="grid">

                <div>
                    <label>YÖN</label>

                    <select id="side">
                        <option value="LONG">LONG</option>
                        <option value="SHORT">SHORT</option>
                    </select>
                </div>

                <div>
                    <label>KALDIRAÇ</label>

                    <select id="lev">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>5</option>
                        <option>10</option>
                        <option>20</option>
                        <option>50</option>
                    </select>
                </div>

                <div>
                    <label>MARJİN</label>

                    <input
                        id="margin"
                        type="number"
                        value="100"
                        min="1">
                </div>

                <div>
                    <label>TP %</label>

                    <input
                        id="tp"
                        type="number"
                        value="5"
                        min="0"
                        step=".1">
                </div>

                <div>
                    <label>SL %</label>

                    <input
                        id="sl"
                        type="number"
                        value="2"
                        min="0"
                        step=".1">
                </div>

            </div>

            <div class="buttons">

                <button
                    class="long"
                    onclick="openPosition('LONG')">
                    LONG AÇ
                </button>

                <button
                    class="short"
                    onclick="openPosition('SHORT')">
                    SHORT AÇ
                </button>

            </div>

            <button
                class="reset"
                onclick="resetAccount()">
                ↻ 10.000'e Sıfırla
            </button>

        </div>

        <div class="box orderbook">

            <div class="title">
                Order Book
            </div>

            <div id="orderBook"></div>

        </div>

        <div class="box positions">

            <div class="title">

                Açık Pozisyonlar

                <span style="float:right">
                    PNL:
                    <b id="totalPnl">0.00</b>
                </span>

            </div>

            <table>

                <thead>

                <tr>
                    <th>Piyasa</th>
                    <th>Yön</th>
                    <th>Giriş</th>
                    <th>Fiyat</th>
                    <th>Lev.</th>
                    <th>TP</th>
                    <th>SL</th>
                    <th>Liq.</th>
                    <th>PNL</th>
                    <th></th>
                </tr>

                </thead>

                <tbody id="positions"></tbody>

            </table>

        </div>

        <div class="box history">

            <div class="title">
                İşlem Geçmişi
            </div>

            <div id="history"></div>

        </div>

    </div>

</div>

<aside class="marketPanel">

    <div class="marketHeader">

        <span>KEMEX Piyasaları</span>

        <span id="count" class="marketCount">120</span>

    </div>

    <div id="markets" class="marketList"></div>

</aside>

</div>

</div>

<script>

/* =====================================================
   KEMEX DEMO ENGINE
===================================================== */

const TOTAL_MARKETS = 120;

/* KALICI KAYIT ANAHTARI */
const STORAGE_KEY = "KEMEX_SAVE_V2";

let timeframe = "1m";
let selected = "KEMCOIN";

let balance = 10000;
let reserved = 0;

let markets = [];
let positions = [];
let history = [];


/* =====================================================
   KAYDETME SİSTEMİ
===================================================== */

function saveGame(){

    try{

        const data = {

            balance: balance,

            reserved: reserved,

            positions: positions,

            history: history,

            selected: selected,

            timeframe: timeframe,

            markets: markets

        };

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

    }catch(error){

        console.error(
            "KEMEX kayıt hatası:",
            error
        );

    }

}


/* =====================================================
   KAYDI YÜKLE
===================================================== */

function loadGame(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!saved)
            return false;

        const data =
            JSON.parse(saved);

        if(
            typeof data.balance === "number"
        ){
            balance = data.balance;
        }

        if(
            typeof data.reserved === "number"
        ){
            reserved = data.reserved;
        }

        if(
            Array.isArray(data.positions)
        ){
            positions = data.positions;
        }

        if(
            Array.isArray(data.history)
        ){
            history = data.history;
        }

        if(
            typeof data.selected === "string"
        ){
            selected = data.selected;
        }

        if(
            typeof data.timeframe === "string"
        ){
            timeframe = data.timeframe;
        }

        if(
            Array.isArray(data.markets) &&
            data.markets.length > 0
        ){

            markets = data.markets;

        }

        return true;

    }catch(error){

        console.error(
            "KEMEX kayıt yükleme hatası:",
            error
        );

        return false;

    }

}


/* Sayfa kapanmadan önce kaydet */

window.addEventListener(
    "beforeunload",
    saveGame
);


/* Mobil cihazlarda sayfa gizlenince kaydet */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "hidden"
        ){

            saveGame();

        }

    }
);


/* =====================================================
   YARDIMCI
===================================================== */

function random(min,max){

    return Math.random()*(max-min)+min;

}


function priceFormat(n){

    if(!Number.isFinite(n))
        return "-";

    if(n>=1000)
        return n.toFixed(2);

    if(n>=1)
        return n.toFixed(4);

    if(n>=0.01)
        return n.toFixed(6);

    return n.toFixed(8);

}


function money(n){

    return "$"+
        Number(n).toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function marketCap(n){

    if(n>=1e9)
        return "$"+
            (n/1e9).toFixed(2)+"B";

    if(n>=1e6)
        return "$"+
            (n/1e6).toFixed(2)+"M";

    if(n>=1e3)
        return "$"+
            (n/1e3).toFixed(2)+"K";

    return "$"+n.toFixed(0);

}


function getStep(){

    if(timeframe==="1m")
        return 60000;

    if(timeframe==="5m")
        return 300000;

    if(timeframe==="15m")
        return 900000;

    if(timeframe==="1h")
        return 3600000;

    if(timeframe==="4h")
        return 14400000;

    return 86400000;

}


/* =====================================================
   PİYASALAR
===================================================== */

const names=[
"KEMCOIN","KEMEX","KEMX","KEMORA","KEMIX",
"KEMIA","KEMO","KEMZ","KEMA","KEMB","KEMC",
"KEMD","KEME","KEMF","KEMG","KEMH","KEMI",
"KEMJ","KEMK","KEML","KEMM","KEMN","KEMO2",
"KEMP","KEMQ","KEMR","KEMS","KEMT","KEMU",
"KEMV","KEMW","KEMY","KEMZ2"
];


function createMarket(symbol,index){

    let price;

    if(index===0)
        price=100;

    else if(index%8===0)
        price=random(1000,5000);

    else if(index%6===0)
        price=random(0.01,1);

    else if(index%4===0)
        price=random(1,20);

    else
        price=random(.1,300);

    let supply=random(
        2000000,
        800000000
    );

    let market={
        symbol:symbol,
        price:price,
        start:price,
        supply:supply,
        marketCap:price*supply,
        change:0,
        volatility:random(.00025,.001),
        candles:[]
    };

    createCandles(market);

    return market;

}


function createCandles(market){

    let price=market.price;

    let now=Date.now();

    let interval=getStep();

    market.candles=[];

    for(
        let i=100;
        i>0;
        i--
    ){

        let open=price;

        let move=
            (Math.random()-.5)*
            market.volatility*
            8;

        let close=
            Math.max(
                .000001,
                open*(1+move)
            );

        let high=
            Math.max(open,close)*
            (
                1+
                Math.random()*
                market.volatility
            );

        let low=
            Math.min(open,close)*
            (
                1-
                Math.random()*
                market.volatility
            );

        market.candles.push({

            time:
                now-i*interval,

            open:open,
            high:high,
            low:low,
            close:close

        });

        price=close;

    }

    market.price=price;

}


/* İlk açılışta piyasaları oluştur */

for(
    let i=0;
    i<TOTAL_MARKETS;
    i++
){

    let symbol;

    if(i<names.length)
        symbol=names[i];
    else
        symbol="KEM"+(i+1);

    markets.push(
        createMarket(
            symbol,
            i
        )
    );

}


/* =====================================================
   KAYDI ŞİMDİ YÜKLE
===================================================== */

loadGame();


/* =====================================================
   PİYASA LİSTESİ
===================================================== */

function renderMarkets(){

    const query=
        document.getElementById(
            "search"
        )
        .value
        .trim()
        .toUpperCase();

    const filtered=
        markets.filter(
            m =>
                m.symbol.includes(query)
        );

    document.getElementById(
        "count"
    ).textContent=
        filtered.length;

    document.getElementById(
        "markets"
    ).innerHTML=
        filtered.map(
            m=>`

            <div
                class="market ${
                    m.symbol===selected
                    ?"active":""
                }"
                onclick="
                    selectMarket('${m.symbol}')
                "
            >

                <div>

                    <div class="marketName">
                        ${m.symbol}
                    </div>

                    <div class="marketCap">
                        Piyasa Değeri
                        ${marketCap(m.marketCap)}
                    </div>

                </div>

                <div class="marketRight">

                    <div class="marketPrice">
                        ${priceFormat(m.price)}
                    </div>

                    <div
                        class="
                        marketChange
                        ${m.change>=0
                            ?"green"
                            :"red"}
                        "
                    >
                        ${
                            m.change>=0
                            ?"+":""
                        }${m.change.toFixed(2)}%
                    </div>

                </div>

            </div>

        `
        )
        .join("");

}


function updateMarkets(){

    document
        .querySelectorAll(".market")
        .forEach(
            row=>{

                const name=
                    row
                    .querySelector(
                        ".marketName"
                    )
                    ?.textContent
                    .trim();

                const market=
                    markets.find(
                        x =>
                            x.symbol===name
                    );

                if(!market)
                    return;

                row
                    .querySelector(
                        ".marketPrice"
                    )
                    .textContent=
                        priceFormat(
                            market.price
                        );

                row
                    .querySelector(
                        ".marketCap"
                    )
                    .textContent=
                        "Piyasa Değeri "+
                        marketCap(
                            market.marketCap
                        );

                const change=
                    row
                    .querySelector(
                        ".marketChange"
                    );

                change.textContent=
                    (
                        market.change>=0
                        ?"+":""
                    )+
                    market.change.toFixed(2)+
                    "%";

                change.className=
                    "marketChange "+
                    (
                        market.change>=0
                        ?"green"
                        :"red"
                    );

            }
        );

}


/* =====================================================
   COIN SEÇİMİ
===================================================== */

function selectMarket(symbol){

    selected=symbol;

    const market=
        markets.find(
            m =>
                m.symbol===symbol
        );

    if(!market)
        return;

    document.getElementById(
        "tradeSymbol"
    ).textContent=
        symbol;

    renderMarkets();

    drawChart();

    updateInfo();

    renderOrderBook();

    saveGame();

}


/* =====================================================
   CHART
===================================================== */

const canvas=
    document.getElementById("chart");

const ctx=
    canvas.getContext("2d");


function resizeCanvas(){

    const rect=
        canvas.getBoundingClientRect();

    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );

    canvas.width=
        Math.max(
            1,
            rect.width*dpr
        );

    canvas.height=
        Math.max(
            1,
            rect.height*dpr
        );

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawChart();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


function drawChart(){

    const market=
        markets.find(
            m =>
                m.symbol===selected
        );

    if(!market)
        return;

    const data=
        market.candles.slice(-80);

    const rect=
        canvas.getBoundingClientRect();

    const width=rect.width;
    const height=rect.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    if(data.length<2)
        return;

    let min=Infinity;
    let max=-Infinity;

    data.forEach(
        candle=>{

            min=Math.min(
                min,
                candle.low
            );

            max=Math.max(
                max,
                candle.high
            );

        }
    );

    const range=max-min||1;

    const left=8;
    const right=70;
    const top=15;
    const bottom=25;

    const chartWidth=
        width-left-right;

    const chartHeight=
        height-top-bottom;

    ctx.strokeStyle="#171b24";
    ctx.lineWidth=1;

    for(
        let i=0;
        i<6;
        i++
    ){

        const y=
            top+
            chartHeight/5*i;

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            width-right,
            y
        );

        ctx.stroke();

        ctx.fillStyle="#707887";
        ctx.font="10px Arial";

        ctx.fillText(
            priceFormat(
                max-range*i/5
            ),
            width-right+5,
            y+3
        );

    }

    const spacing=
        chartWidth/data.length;

    const bodyWidth=
        Math.max(
            2,
            spacing*.62
        );

    data.forEach(
        (candle,index)=>{

            const x=
                left+
                spacing*index+
                spacing/2;

            const highY=
                top+
                (
                    1-
                    (candle.high-min)/range
                )*
                chartHeight;

            const lowY=
                top+
                (
                    1-
                    (candle.low-min)/range
                )*
                chartHeight;

            const openY=
                top+
                (
                    1-
                    (candle.open-min)/range
                )*
                chartHeight;

            const closeY=
                top+
                (
                    1-
                    (candle.close-min)/range
                )*
                chartHeight;

            const up=
                candle.close>=candle.open;

            ctx.strokeStyle=
                up
                ?"#26a69a"
                :"#ef5350";

            ctx.fillStyle=
                up
                ?"#26a69a"
                :"#ef5350";

            ctx.beginPath();

            ctx.moveTo(x,highY);
            ctx.lineTo(x,lowY);

            ctx.stroke();

            ctx.fillRect(
                x-bodyWidth/2,
                Math.min(
                    openY,
                    closeY
                ),
                bodyWidth,
                Math.max(
                    1,
                    Math.abs(
                        closeY-openY
                    )
                )
            );

        }
    );

    const price=market.price;

    const priceY=
        top+
        (
            1-
            (price-min)/range
        )*
        chartHeight;

    ctx.strokeStyle="#f0b90b";

    ctx.setLineDash([4,4]);

    ctx.beginPath();

    ctx.moveTo(
        left,
        priceY
    );

    ctx.lineTo(
        width-right,
        priceY
    );

    ctx.stroke();

    ctx.setLineDash([]);

    ctx.fillStyle="#f0b90b";

    ctx.fillRect(
        width-right,
        priceY-9,
        right,
        18
    );

    ctx.fillStyle="#111";

    ctx.font="10px Arial";

    ctx.fillText(
        priceFormat(price),
        width-right+5,
        priceY+3
    );

}

/* =====================================================
   POZİSYON
===================================================== */

function currentPrice(symbol){

    const market=
        markets.find(
            m =>
                m.symbol===symbol
        );

    return market
        ?market.price
        :0;

}


function calculatePNL(position){

    const price=
        currentPrice(
            position.symbol
        );

    const change=
        (
            price-position.entry
        )/
        position.entry*
        100;

    return (
        position.side==="LONG"
        ?change
        :-change
    )*
    position.leverage*
    position.margin/
    100;

}


function levels(position){

    const entry=position.entry;

    const tpDistance=
        position.tp/
        100/
        position.leverage;

    const slDistance=
        position.sl/
        100/
        position.leverage;

    let tp;
    let sl;
    let liquidation;

    if(position.side==="LONG"){

        tp=
            entry*
            (1+tpDistance);

        sl=
            entry*
            (1-slDistance);

        liquidation=
            entry*
            (
                1-
                1/position.leverage
            );

    }else{

        tp=
            entry*
            (1-tpDistance);

        sl=
            entry*
            (1+slDistance);

        liquidation=
            entry*
            (
                1+
                1/position.leverage
            );

    }

    return{
        tp,
        sl,
        liquidation
    };

}


/* =====================================================
   POZİSYON AÇ
===================================================== */

function openPosition(side){

    const margin=
        Number(
            document.getElementById(
                "margin"
            ).value
        );

    const leverage=
        Number(
            document.getElementById(
                "lev"
            ).value
        );

    const tp=
        Number(
            document.getElementById(
                "tp"
            ).value
        );

    const sl=
        Number(
            document.getElementById(
                "sl"
            ).value
        );

    const price=
        currentPrice(selected);

    if(
        !Number.isFinite(margin)||
        margin<=0
    ){

        alert(
            "Geçerli bir marjin gir."
        );

        return;

    }

    if(
        margin>
        balance-reserved
    ){

        alert(
            "Yetersiz bakiye!"
        );

        return;

    }

    positions.push({

        id:
            Date.now()+
            Math.random(),

        symbol:selected,

        side:side,

        entry:price,

        margin:margin,

        leverage:leverage,

        tp:
            Number.isFinite(tp)
            ?tp
            :0,

        sl:
            Number.isFinite(sl)
            ?sl
            :0

    });

    reserved+=margin;

    renderPositions();

    updateWallet();

    drawChart();

    /* POZİSYONU HEMEN KAYDET */
    saveGame();

}


/* =====================================================
   POZİSYON KAPAT
===================================================== */

function closePosition(
    id,
    reason="MANUEL"
){

    const index=
        positions.findIndex(
            p =>
                String(p.id)===
                String(id)
        );

    if(index<0)
        return;

    const position=
        positions[index];

    const result=
        calculatePNL(position);

    balance+=
        position.margin+
        result;

    reserved-=
        position.margin;

    if(reserved<0)
        reserved=0;

    history.unshift({

        time:
            new Date()
            .toLocaleTimeString(),

        symbol:
            position.symbol,

        side:
            position.side,

        pnl:
            result,

        reason:
            reason

    });

    positions.splice(
        index,
        1
    );

    renderPositions();

    renderHistory();

    updateWallet();

    drawChart();

    /* KAPANDIĞINI DA KAYDET */
    saveGame();

}


/* =====================================================
   POZİSYON TABLOSU
===================================================== */

function renderPositions(){

    const body=
        document.getElementById(
            "positions"
        );

    let total=0;

    if(
        positions.length===0
    ){

        body.innerHTML=`

            <tr>

                <td
                    colspan="10"
                    class="gray"
                >
                    Açık pozisyon yok.
                </td>

            </tr>

        `;

        document.getElementById(
            "totalPnl"
        ).textContent="0.00";

        return;

    }

    body.innerHTML=
        positions.map(
            position=>{

                const pnl=
                    calculatePNL(
                        position
                    );

                total+=pnl;

                const l=
                    levels(position);

                return`

                    <tr>

                        <td>
                            ${position.symbol}
                        </td>

                        <td
                            class="
                            ${
                                position.side===
                                "LONG"
                                ?"green"
                                :"red"
                            }
                            "
                        >
                            ${position.side}
                        </td>

                        <td>
                            ${priceFormat(
                                position.entry
                            )}
                        </td>

                        <td>
                            ${priceFormat(
                                currentPrice(
                                    position.symbol
                                )
                            )}
                        </td>

                        <td>
                            ${position.leverage}x
                        </td>

                        <td class="green">
                            ${priceFormat(l.tp)}
                        </td>

                        <td class="red">
                            ${priceFormat(l.sl)}
                        </td>

                        <td class="red">
                            ${priceFormat(
                                l.liquidation
                            )}
                        </td>

                        <td
                            class="
                            ${
                                pnl>=0
                                ?"green"
                                :"red"
                            }
                            "
                        >
                            ${
                                pnl>=0
                                ?"+":""
                            }${pnl.toFixed(2)}
                        </td>

                        <td>

                            <button
                                class="close"
                                onclick="
                                closePosition(
                                    '${position.id}'
                                )
                                "
                            >
                                Kapat
                            </button>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");

    const totalElement=
        document.getElementById(
            "totalPnl"
        );

    totalElement.textContent=
        (
            total>=0
            ?"+":""
        )+
        total.toFixed(2);

    totalElement.className=
        total>=0
        ?"green"
        :"red";

}


/* =====================================================
   TP / SL / LIQ
===================================================== */

function checkPositions(){

    positions
        .slice()
        .forEach(
            position=>{

                const price=
                    currentPrice(
                        position.symbol
                    );

                const pnl=
                    calculatePNL(
                        position
                    );

                const percent=
                    pnl/
                    position.margin*
                    100;

                if(
                    position.tp>0&&
                    percent>=position.tp
                ){

                    closePosition(
                        position.id,
                        "TP"
                    );

                    return;

                }

                if(
                    position.sl>0&&
                    percent<=-position.sl
                ){

                    closePosition(
                        position.id,
                        "SL"
                    );

                    return;

                }

                const liq=
                    levels(
                        position
                    ).liquidation;

                if(
                    (
                        position.side===
                        "LONG"&&
                        price<=liq
                    )||
                    (
                        position.side===
                        "SHORT"&&
                        price>=liq
                    )
                ){

                    closePosition(
                        position.id,
                        "LIQ"
                    );

                }

            }
        );

}


/* =====================================================
   CÜZDAN
===================================================== */

function updateWallet(){

    let unrealized=0;

    positions.forEach(
        position=>{

            unrealized+=
                calculatePNL(
                    position
                );

        }
    );

    const equity=
        balance+
        unrealized;

    document.getElementById(
        "balance"
    ).textContent=
        money(balance);

    document.getElementById(
        "available"
    ).textContent=
        money(
            Math.max(
                0,
                balance-reserved
            )
        );

    document.getElementById(
        "equity"
    ).textContent=
        money(equity);

}

function resetAccount(){

    if(
        !confirm(

    balance=10000;

/* =====================================================
   PİYASA HAREKETİ
===================================================== */

function tickMarkets(){

    markets.forEach(
        market=>{

            const oldPrice=
                market.price;

            const movement=
                (
                    Math.random()-.5
                )*
                market.volatility*
                .35;

            market.price=
                Math.max(
                    .000001,
                    market.price*
                    (1+movement)
                );

            const now=Date.now();

            const interval=
                getStep();

            let candle=
                market.candles[
                    market.candles.length-1
                ];

            if(
                !candle||
                now-candle.time>=interval
            ){

                candle={

                    time:now,

                    open:oldPrice,

                    high:
                        Math.max(
                            oldPrice,
                            market.price
                        ),

                    low:
                        Math.min(
                            oldPrice,
                            market.price
                        ),

                    close:
                        market.price

                };

                market.candles.push(
                    candle
                );

                if(
                    market.candles.length>160
                ){

                    market.candles.shift();

                }

            }else{

                candle.close=
                    market.price;

                candle.high=
                    Math.max(
                        candle.high,
                        market.price
                    );

                candle.low=
                    Math.min(
                        candle.low,
                        market.price
                    );

            }

            market.marketCap=
                market.price*
                market.supply;

            market.change=
                (
                    market.price-
                    market.start
                )/
                market.start*
                100;

            if(
                Math.abs(
                    market.change
                )>100
            ){

                market.start=
                    market.price;

                market.change=0;

            }

        }
    );

}


/* =====================================================
   TIMEFRAME
===================================================== */

document
    .querySelectorAll(".tf")
    .forEach(
        button=>{

            button.onclick=()=>{

                document
                    .querySelectorAll(".tf")
                    .forEach(
                        x =>
                            x.classList
                            .remove("active")
                    );

                button.classList.add(
                    "active"
                );

                timeframe=
                    button.dataset.tf;

                markets.forEach(
                    createCandles
                );

                selectMarket(
                    selected
                );

                saveGame();

            };

        }
    );

    .getElementById("search")
    .addEventListener(
        "input",
        renderMarkets
    );


/* =====================================================
   ANA DÖNGÜ
===================================================== */

let lastTick=0;
let lastDraw=0;
let lastBook=0;
let lastMarket=0;
let lastPosition=0;
let lastSave=0;


function loop(time){

    if(
        time-lastTick>250
    ){

        tickMarkets();

        lastTick=time;

    }

    if(
        time-lastDraw>100
    ){

        drawChart();

        updateInfo();

        lastDraw=time;

    }

    if(
        time-lastBook>500
    ){

        renderOrderBook();

        lastBook=time;

    }

    if(
        time-lastMarket>500
    ){

        updateMarkets();

        lastMarket=time;

    }

    if(
        time-lastPosition>400
    ){

        checkPositions();

        renderPositions();

        updateWallet();

        lastPosition=time;

    }

    /*
       HER 2 SANİYEDE BİR
       OTOMATİK KAYDET
    */

    if(
        time-lastSave>2000
    ){

        saveGame();

        lastSave=time;

    }

    requestAnimationFrame(
        loop
    );

}


/* =====================================================
   BAŞLAT
===================================================== */

renderMarkets();

if(
    !markets.some(
        m =>
            m.symbol===selected
    )
){

    selected="KEMCOIN";

}

selectMarket(selected);

renderPositions();

renderHistory();

updateWallet();

resizeCanvas();

requestAnimationFrame(loop);

</script>
